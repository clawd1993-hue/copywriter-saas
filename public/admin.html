<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jimmy Labs — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg:#0f1115; --card:#191c22; --line:#262a32; --text:#e8eaed; --muted:#9aa0aa; --accent:#7c5cff; --green:#3fb950; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:20px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  header .who { margin-left:auto; color:var(--muted); font-size:13px; }
  main { padding:24px; max-width:1100px; margin:0 auto; }
  .msg { color:var(--muted); padding:40px; text-align:center; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:24px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .tile .k { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .tile .v { font-size:26px; font-weight:700; margin-top:6px; }
  .tile .v.green { color:var(--green); }
  h2 { font-size:14px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:26px 0 10px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  th,td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); font-size:14px; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  tr:last-child td { border-bottom:none; }
  td.num,th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .cost { color:var(--green); font-weight:600; }
  .pill { display:inline-block; padding:2px 8px; border-radius:20px; background:#222634; font-size:12px; color:var(--muted); }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  .sub { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>📊 Jimmy Labs — Admin</h1>
  <nav id="nav" style="display:none;margin-left:20px;display:flex;gap:8px">
    <button class="tab" data-tab="costs">💰 Costs</button>
    <button class="tab" data-tab="users">👥 Users</button>
  </nav>
  <span class="who" id="who"></span>
</header>
<main id="main"><div class="msg" id="status">Checking access…</div></main>

<!-- USER VIEWER (read-only impersonation: see a user's projects + generated content) -->
<div id="viewer" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto">
  <div style="background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:820px;width:100%;padding:20px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px">
      <h2 id="viewer-title" style="margin:0;font-size:16px">User</h2>
      <button onclick="closeViewer()" style="background:#2a2f3a">✕ Close</button>
    </div>
    <div id="viewer-body"></div>
  </div>
</div>

<style>
  .tab{background:#222634;color:var(--muted)}
  .tab.active{background:var(--accent);color:#fff}
  .bar{height:6px;border-radius:4px;background:#222634;overflow:hidden;margin-top:4px}
  .bar > i{display:block;height:100%;background:var(--green)}
  .bar > i.warn{background:#d29922}.bar > i.hot{background:#f85149}
  .st{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}
  .st.none{background:#2a2f3a;color:#9aa0aa}.st.active{background:#12331d;color:#3fb950}
  .st.past_due{background:#3a2a12;color:#d29922}.st.canceled{background:#3a1a1a;color:#f85149}
</style>

<script>
const $ = s => document.querySelector(s);
const money = n => '$' + (Number(n)||0).toFixed(2);
const k = n => (Number(n)||0).toLocaleString();

async function boot() {
  let cfg = {};
  try { cfg = await (await fetch('/api/config')).json(); } catch (e) {}
  if (!cfg.authEnabled || !window.supabase) { $('#status').textContent = 'Auth not configured.'; return; }
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const { data } = await sb.auth.getSession();
  const session = data && data.session;
  if (!session) { $('#status').innerHTML = 'Not logged in. <a href="/" style="color:var(--accent)">Log in on the main app</a>, then come back here.'; return; }
  $('#who').textContent = session.user.email;
  const H = { headers: { Authorization: 'Bearer ' + session.access_token } };
  let usage, usersData;
  try {
    const r = await fetch('/api/admin/usage', H);
    if (r.status === 403) { $('#status').innerHTML = '🔒 <b>' + session.user.email + '</b> is not an admin account.'; return; }
    usage = await r.json();
    usersData = await (await fetch('/api/admin/users', H)).json();
  } catch (e) { $('#status').textContent = 'Could not load admin data.'; return; }
  $('#nav').style.display = 'flex';
  window._token = session.access_token;
  window._usage = usage; window._users = usersData;
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => show(b.dataset.tab));
  show('users');
}

function show(tab) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'users') renderUsers(window._users); else render(window._usage);
}

function renderUsers(d) {
  const cap = d.cap || 50;
  const rows = (d.users || []).map(u => {
    const pct = Math.min(100, (Number(u.month_cost) / cap) * 100);
    const cls = pct >= 90 ? 'hot' : pct >= 60 ? 'warn' : '';
    const dt = (u.created_at || '').slice(0, 10);
    const em = (u.email || '').replace(/'/g, "\\'");
    return `<tr>
      <td>${u.email || '—'}</td>
      <td><span class="st ${u.status || 'none'}">${u.status || 'none'}</span></td>
      <td class="num">${k(u.projects)}</td>
      <td class="num">${money(u.month_cost)} <span class="sub">/ ${money(cap)}</span><div class="bar"><i class="${cls}" style="width:${pct}%"></i></div></td>
      <td class="sub">${dt}</td>
      <td>${u.email ? `<button onclick="viewUser('${em}')">View</button>` : ''}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" class="sub">No users yet.</td></tr>';
  $('#main').innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="k">Total users</div><div class="v">${k((d.users||[]).length)}</div></div>
      <div class="tile"><div class="k">Paying (active)</div><div class="v green">${k((d.users||[]).filter(u=>u.status==='active').length)}</div></div>
      <div class="tile"><div class="k">Per-user cap</div><div class="v">${money(cap)}</div><div class="sub">/ month</div></div>
    </div>
    <h2>All users</h2>
    <table><thead><tr><th>Email</th><th>Status</th><th class="num">Projects</th><th class="num">This-month spend</th><th>Joined</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    <p class="sub" style="margin-top:12px">Status is <b>none</b> for everyone until Stripe billing is wired — then it flips to active / past_due / canceled automatically.</p>`;
}

const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// lightweight markdown → HTML so stored outputs read cleanly (no raw ** and ## noise)
function mdLite(s) {
  let t = esc(s == null ? '' : String(s));
  t = t.replace(/^\s*#{1,6}\s?(.*)$/gm, '<div style="font-weight:700;font-size:1.05em;margin:8px 0 2px">$1</div>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  t = t.replace(/^\s*[-•]\s+(.*)$/gm, '<div style="padding-left:14px">• $1</div>');
  t = t.replace(/\n{2,}/g, '<br><br>').replace(/\n/g, '<br>');
  return t;
}
const TYPE_LABEL = { 'dts-vsl':'Direct-To-Sale VSL', 'dts-webinar':'Direct-To-Sale Webinar', 'call-booker':'Call-Booker VSL' };

async function viewUser(email) {
  const m = $('#viewer'); const body = $('#viewer-body');
  $('#viewer-title').textContent = 'Loading ' + email + '…';
  m.style.display = 'flex'; body.innerHTML = '<p class="sub">Fetching projects…</p>';
  let d;
  try {
    const r = await fetch('/api/admin/user-detail?email=' + encodeURIComponent(email), { headers: { Authorization: 'Bearer ' + window._token } });
    d = await r.json();
  } catch (e) { body.innerHTML = '<p class="sub">Could not load this user.</p>'; return; }
  $('#viewer-title').textContent = email + ' — ' + (d.projects || []).length + ' project(s)';
  if (!d.projects || !d.projects.length) { body.innerHTML = '<p class="sub">No projects yet for this user.</p>'; return; }
  body.innerHTML = d.projects.map(p => {
    const sc = p.step_content && typeof p.step_content === 'object' ? p.step_content : {};
    const se = p.section_content && typeof p.section_content === 'object' ? p.section_content : {};
    const block = (label, obj) => {
      const keys = Object.keys(obj);
      if (!keys.length) return `<div class="sub" style="margin:6px 0">No ${label.toLowerCase()} yet.</div>`;
      return keys.map(kk => `<details style="margin:6px 0"><summary><b>${label} ${esc(kk)}</b> <span class="sub">(${(String(obj[kk]||'').length).toLocaleString()} chars)</span></summary><div style="background:#0f1115;border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:6px;font-size:13px;line-height:1.5;overflow:auto;max-height:360px">${mdLite(obj[kk])}</div></details>`).join('');
    };
    const msgs = Array.isArray(p.messages) ? p.messages : [];
    const chat = msgs.length ? msgs.map(mm => {
      const isUser = mm.role === 'user';
      return `<div style="margin:6px 0;display:flex;${isUser?'justify-content:flex-end':''}">
        <div style="max-width:85%;background:${isUser?'var(--accent)':'#0f1115'};color:${isUser?'#fff':'var(--text)'};border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.5">${mdLite(mm.content)}</div>
      </div>`;
    }).join('') : '<div class="sub" style="margin:6px 0">No chat messages yet.</div>';
    return `<div style="border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px">
      <div style="font-weight:700;font-size:15px">${esc(p.title || 'Untitled')}</div>
      <div class="sub" style="margin-bottom:8px">${TYPE_LABEL[p.project_type] || p.project_type || '—'} · created ${(p.created_at||'').slice(0,10)} · ${msgs.length} message(s)</div>
      <details style="margin-top:8px"><summary><b style="font-size:13px">💬 Chat conversation</b> <span class="sub">(${msgs.length})</span></summary><div style="margin-top:8px;max-height:420px;overflow:auto;background:#0d0f13;border:1px solid var(--line);border-radius:8px;padding:10px">${chat}</div></details>
      <div style="margin-top:10px"><b style="font-size:13px">8-Step System (outputs)</b>${block('Step', sc)}</div>
      <div style="margin-top:10px"><b style="font-size:13px">Copywriting Sections (outputs)</b>${block('Section', se)}</div>
    </div>`;
  }).join('');
}
function closeViewer() { $('#viewer').style.display = 'none'; }

function render(d) {
  const tiles = `
    <div class="tiles">
      <div class="tile"><div class="k">This month spend</div><div class="v green">${money(d.totalCost)}</div><div class="sub">${d.month}</div></div>
      <div class="tile"><div class="k">Avg / project</div><div class="v">${money(d.avgPerProject)}</div><div class="sub">real cost per VSL</div></div>
      <div class="tile"><div class="k">Projects built</div><div class="v">${k(d.projectCount)}</div></div>
      <div class="tile"><div class="k">Active users</div><div class="v">${k(d.userCount)}</div></div>
      <div class="tile"><div class="k">Total calls</div><div class="v">${k(d.calls)}</div></div>
    </div>`;

  const users = `
    <h2>Cost per user (top spenders)</h2>
    <table><thead><tr><th>User</th><th class="num">Cost</th><th class="num">Calls</th><th class="num">In tok</th><th class="num">Out tok</th></tr></thead><tbody>
    ${(d.topUsers||[]).map(u => `<tr><td>${u.email||'—'}</td><td class="num cost">${money(u.cost)}</td><td class="num">${k(u.calls)}</td><td class="num">${k(u.inTok)}</td><td class="num">${k(u.outTok)}</td></tr>`).join('') || '<tr><td colspan="5" class="sub">No usage yet — build a VSL to see data.</td></tr>'}
    </tbody></table>`;

  const steps = `
    <h2>Cost by step / section</h2>
    <table><thead><tr><th>Step</th><th class="num">Cost</th><th class="num">Calls</th><th class="num">Avg/call</th></tr></thead><tbody>
    ${(d.steps||[]).map(s => `<tr><td>${s.step}</td><td class="num cost">${money(s.cost)}</td><td class="num">${k(s.calls)}</td><td class="num">${money(s.calls? s.cost/s.calls : 0)}</td></tr>`).join('') || '<tr><td colspan="4" class="sub">No data yet.</td></tr>'}
    </tbody></table>`;

  const projects = `
    <h2>Cost per project (top 60)</h2>
    <table><thead><tr><th>Project</th><th>Type</th><th>User</th><th class="num">Cost</th><th class="num">Calls</th></tr></thead><tbody>
    ${(d.topProjects||[]).map(p => `<tr><td class="sub">${(p.id||'—').slice(0,8)}</td><td><span class="pill">${p.type||'?'}</span></td><td class="sub">${p.email||'—'}</td><td class="num cost">${money(p.cost)}</td><td class="num">${k(p.calls)}</td></tr>`).join('') || '<tr><td colspan="5" class="sub">No data yet.</td></tr>'}
    </tbody></table>`;

  $('#main').innerHTML = tiles + users + steps + projects;
}

boot();
</script>
</body>
</html>
