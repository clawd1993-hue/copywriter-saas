<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reset Password — Jimmy Lab</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1115;color:#e8eaed;font:16px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;padding:24px}
  .card{max-width:400px;width:100%;background:#191c22;border:1px solid #262a32;border-radius:16px;padding:32px;text-align:center}
  .logo{font-size:30px;margin-bottom:6px}
  h1{font-size:22px;margin:0 0 6px}
  p.sub{color:#9aa0aa;font-size:14px;margin:0 0 22px}
  input{width:100%;box-sizing:border-box;background:#0f1115;border:1px solid #262a32;border-radius:10px;padding:13px;color:#e8eaed;font-size:15px;margin-bottom:12px}
  button{width:100%;background:#7c5cff;color:#fff;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .msg{font-size:14px;margin-top:14px;min-height:18px}
  .err{color:#f0616d}.ok{color:#3fb950}
  a{color:#7c5cff;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">✍️</div>
  <h1>Set a new password</h1>
  <p class="sub" id="sub">Enter a new password for your Jimmy Lab account.</p>
  <div id="form-wrap">
    <input id="pw1" type="password" placeholder="New password (6+ chars)" autocomplete="new-password" />
    <input id="pw2" type="password" placeholder="Confirm new password" autocomplete="new-password" />
    <button id="save">Update password</button>
  </div>
  <p class="msg" id="msg"></p>
  <p style="margin-top:16px"><a href="/">← Back to Jimmy Lab</a></p>
</div>
<script>
(async function () {
  const msg = document.getElementById('msg');
  const setMsg = (t, cls) => { msg.textContent = t; msg.className = 'msg ' + (cls || ''); };
  let sb = null, recoveryReady = false;

  let cfg = {};
  try { cfg = await (await fetch('/api/config')).json(); } catch (e) {}
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) { setMsg('Reset is temporarily unavailable. Try again shortly.', 'err'); return; }

  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  // Supabase auto-parses the recovery token from the URL hash and fires PASSWORD_RECOVERY.
  sb.auth.onAuthStateChange((event) => { if (event === 'PASSWORD_RECOVERY') recoveryReady = true; });

  // Also check for an existing session (covers the case where it's already established).
  const { data } = await sb.auth.getSession();
  if (data && data.session) recoveryReady = true;

  document.getElementById('save').addEventListener('click', async () => {
    const p1 = document.getElementById('pw1').value || '';
    const p2 = document.getElementById('pw2').value || '';
    if (p1.length < 6) { setMsg('Password must be at least 6 characters.', 'err'); return; }
    if (p1 !== p2) { setMsg('Passwords don’t match.', 'err'); return; }
    const btn = document.getElementById('save');
    btn.disabled = true; btn.textContent = 'Updating…';
    try {
      const { error } = await sb.auth.updateUser({ password: p1 });
      if (error) {
        setMsg(/session|auth|token|expired/i.test(error.message || '')
          ? 'This reset link has expired. Request a new one from the login screen.'
          : (error.message || 'Could not update password.'), 'err');
        btn.disabled = false; btn.textContent = 'Update password';
        return;
      }
      document.getElementById('form-wrap').style.display = 'none';
      setMsg('✅ Password updated! Redirecting you to sign in…', 'ok');
      try { await sb.auth.signOut(); } catch (e) {}
      setTimeout(() => { location.href = '/'; }, 1800);
    } catch (e) {
      setMsg('Something went wrong — try again.', 'err');
      btn.disabled = false; btn.textContent = 'Update password';
    }
  });
})();
</script>
</body>
</html>
