<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FFC Sales Funnel — May → Nov 2026</title>
<style>
:root{color-scheme:light;--surface:#fcfcfb;--card:#ffffff;--text:#0b0b0b;--text2:#52514e;--muted:#8a8984;--grid:#e6e5e1;--series:#2a78d6;--series-soft:rgba(42,120,214,.12);--btn:#f1f0ec;--btn-on:#0b0b0b;--btn-on-text:#fff;--border:#dcdbd6;--green:#1f9d57;--yellow:#c98a00;--red:#d0453b}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--surface:#1a1a19;--card:#232322;--text:#fff;--text2:#c3c2b7;--muted:#8d8c86;--grid:#333331;--series:#3987e5;--series-soft:rgba(57,135,229,.18);--btn:#2e2e2c;--btn-on:#fff;--btn-on-text:#0b0b0b;--border:#3a3a38;--green:#34c77b;--yellow:#e3ad2e;--red:#e4675c}}
*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--text);font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--text2);font-size:13px;margin:0 0 16px}
.refresh{border:1px solid var(--border);background:var(--btn);color:var(--text);border-radius:999px;padding:8px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
.refresh:disabled{opacity:.5;cursor:default}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tab{border:1px solid var(--border);background:var(--btn);color:var(--text);border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer;line-height:1.2}
.tab[aria-selected=true]{background:var(--btn-on);color:var(--btn-on-text);border-color:var(--btn-on)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 16px 10px;position:relative}
.card h2{font-size:17px;margin:0 0 2px}.card .desc{color:var(--text2);font-size:13px;margin:0 0 10px}
.hero{display:flex;align-items:baseline;gap:10px;margin:0 0 6px}.hero b{font-size:30px;font-weight:700;letter-spacing:-.01em}.hero span{color:var(--text2);font-size:13px}
svg{width:100%;height:auto;display:block;overflow:visible}
.tt{position:absolute;pointer-events:none;background:var(--text);color:var(--surface);font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%);display:none;z-index:2}
.foot{color:var(--muted);font-size:12px;margin-top:10px}
.tblbtn{margin-top:14px;background:none;border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--grid)}th:first-child,td:first-child{text-align:left}th{color:var(--text2);font-weight:600}
.tiles{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.tile{flex:1;min-width:92px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.tile .n{font-size:26px;font-weight:700;line-height:1}.tile .l{color:var(--text2);font-size:13px;margin-top:4px}.tile .p{color:var(--muted);font-size:12px}
</style></head><body><div class="wrap">
<div class="top"><h1>FFC Sales Funnel</h1><button class="refresh" id="refresh">🔄 Refresh</button></div>
<p class="sub">Source: Hyros + live lead-score feed. Customer per FFC-METRIC-DEFINITIONS.md (locked 2026-11-18): unique email with a sale $0.01–$97, excluding the plan-ct-lt test account; licensees included. Funnel May → Nov 2026 (Hyros pull 2026-11-13; Nov partial). Lead Quality Score = live.</p>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="card"><h2 id="t"></h2><p class="desc" id="d"></p><div class="hero"><b id="hv"></b><span id="hs"></span></div><div id="chart"></div><div class="tt" id="tt"></div><p class="foot" id="f"></p>
<button class="tblbtn" id="tb">Show table</button><div id="tbl" style="display:none"></div></div>
</div>
<script>
const SUPA='https://cmefzycouallezhohvro.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtZWZ6eWNvdWFsbGV6aG9odnJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3MDEwMTYsImV4cCI6MjA5OTI3NzAxNn0.JFnrwgYURZmF7VUcs0yComZTHlejxdQ-5PAKhszRPAk';
const ROWS=[{"month": "2026-05", "signups": 633, "leads": 272, "booked": 141, "closes": null, "cash": null, "s2l": 43.0, "l2b": 51.8, "b2c": null}, {"month": "2026-06", "signups": 485, "leads": 307, "booked": 168, "closes": 27, "cash": 58169, "s2l": 63.3, "l2b": 54.7, "b2c": 16.1}, {"month": "2026-07", "signups": 406, "leads": 263, "booked": 140, "closes": 29, "cash": 90440, "s2l": 64.8, "l2b": 53.2, "b2c": 20.7}, {"month": "2026-08", "signups": 306, "leads": 191, "booked": 111, "closes": 15, "cash": 38082, "s2l": 62.4, "l2b": 58.1, "b2c": 13.5}, {"month": "2026-09", "signups": 97, "leads": 55, "booked": 49, "closes": 8, "cash": 23932, "s2l": 56.7, "l2b": 89.1, "b2c": 16.3}, {"month": "2026-10", "signups": 133, "leads": 88, "booked": 56, "closes": 7, "cash": 16897, "s2l": 66.2, "l2b": 63.6, "b2c": 12.5}, {"month": "2026-11", "signups": 95, "leads": 52, "booked": 27, "closes": 3, "cash": 6500, "s2l": 54.7, "l2b": 51.9, "b2c": 11.1}];
const M=ROWS.map(r=>{const [y,m]=r.month.split('-');return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]});
let LQ=null;
const VIEWS=[
 {id:'ads',btn:'How are the ads doing?',title:'How are the ads doing?',desc:'Customers = unique front-end buyers per month (FFC-METRIC-DEFINITIONS rule).',key:'signups',pct:false,
  foot:'Customer = unique email with a sale $0.01–$97, excluding the plan-ct-lt test account (licensees included). Sep + Oct are under-captured in Hyros (tracking rewire). Nov = partial.'},
 {id:'connect',btn:'How many are connecting to the setter?',title:'How many of them are connecting to the setter?',desc:'Leads ÷ signups. Lead = signup who connected with a setter in ManyChat.',key:'s2l',pct:true,
  foot:'Connected = customers carrying the setter-connected tag in Hyros (from /leads). May is partial (connected tag starts mid-May). Sep–Nov are backfill-reconstructed (tag was dead ~Sep–Nov 17); flat ~65% only certifiable May–Aug. Nov reads low (connecting lags purchase).'},
 {id:'setters',btn:'How are the setters doing?',title:'How are the setters doing?',desc:'Booked calls ÷ leads. Booked = non-cancelled sales call with a closer.',key:'l2b',pct:true,
  foot:'Booked = Hyros calls (non-cancelled) ÷ Hyros connected leads. Sep/Oct slightly inflated by the under-captured denominator.'},
 {id:'closers',btn:'How are the closers doing?',title:'How are the closers doing?',desc:'High-ticket closes ÷ booked calls. Close = customer’s first charge over $1,000 (high-ticket rule). Deposits/instalments ≤$1,000 don’t count as a close.',key:'b2c',pct:true,
  foot:'May blank: FanBasis pushed 83 historical payments into Hyros on May 22 (backfill), so May closes aren’t real.'},
 {id:'lq',type:'lq',btn:'Lead Quality Score',title:'Lead Quality Score',desc:'Live score of FFC Elite call applicants (0–100, Hormozi money-gate model). From the booking form via Zapier. 🟢≥70 · 🟡 45–69 · 🔴 <45.',
  foot:'Score = budget/access (45) + work situation (20) + savings-credit (20) + timeline (15). Auto-🔴: "just researching", or not-working+<$1k, or <$1k+won’t-use-credit. Builds as bookings flow. v1.1 — recalibrates vs close-rate.'}
];
let cur=0;const tabs=document.getElementById('tabs');
VIEWS.forEach((v,i)=>{const b=document.createElement('button');b.className='tab';b.role='tab';b.textContent=v.btn;b.onclick=()=>{cur=i;render()};tabs.appendChild(b)});
function fmt(v,p){return v==null?'—':(p?v.toFixed(0)+'%':v.toLocaleString())}
function render(){
 const v=VIEWS[cur];[...tabs.children].forEach((b,i)=>b.setAttribute('aria-selected',i===cur));
 document.getElementById('t').textContent=v.title;document.getElementById('d').textContent=v.desc;document.getElementById('f').textContent=v.foot;
 if(v.type==='lq'){renderLQ();return;}
 const vals=ROWS.map(r=>r[v.key]);const last=[...vals].reverse().find(x=>x!=null);const idx=vals.lastIndexOf(last);
 document.getElementById('hv').textContent=fmt(last,v.pct);document.getElementById('hs').textContent='latest ('+M[idx]+')';
 const W=900,H=320,L=48,R=24,T=20,B=40;const xs=i=>L+i*(W-L-R)/(ROWS.length-1);
 const nums=vals.filter(x=>x!=null);let max=Math.max(...nums),min=0;if(v.pct){max=Math.min(100,Math.ceil(max/10)*10+10)}else{max=Math.ceil(max/100)*100+50}
 const ys=y=>T+(H-T-B)*(1-(y-min)/(max-min));
 const ticks=5;let g='';for(let k=0;k<=ticks;k++){const yv=min+(max-min)*k/ticks,y=ys(yv);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v.pct?yv.toFixed(0)+'%':yv.toLocaleString()}</text>`}
 let path='',pts='',labels='',started=false;
 ROWS.forEach((r,i)=>{const y=vals[i];if(y==null){started=false;return}const X=xs(i),Y=ys(y);path+=(started?' L':' M')+X+' '+Y;started=true;
  pts+=`<circle cx="${X}" cy="${Y}" r="5" fill="var(--series)" stroke="var(--card)" stroke-width="2"/>`;
  if(i===idx||i===0||y===Math.max(...nums)||y===Math.min(...nums))labels+=`<text x="${X}" y="${Y-12}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text)">${fmt(y,v.pct)}</text>`});
 let xl='';M.forEach((m,i)=>{xl+=`<text x="${xs(i)}" y="${H-B+22}" text-anchor="middle" font-size="12" fill="var(--text2)">${m}</text>`});
 let hit='';ROWS.forEach((r,i)=>{hit+=`<rect data-i="${i}" x="${xs(i)-((W-L-R)/(ROWS.length-1))/2}" y="${T}" width="${(W-L-R)/(ROWS.length-1)}" height="${H-T-B}" fill="transparent"/>`});
 document.getElementById('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${v.title}">${g}<line x1="${L}" x2="${W-R}" y1="${ys(min)}" y2="${ys(min)}" stroke="var(--border)"/><path d="${path}" fill="none" stroke="var(--series)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts}${labels}${xl}<g id="hits">${hit}</g><line id="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3" style="display:none"/></svg>`;
 const svg=document.querySelector('#chart svg'),tt=document.getElementById('tt'),xh=document.getElementById('xh');
 svg.querySelectorAll('#hits rect').forEach(rc=>{rc.onmousemove=e=>{const i=+rc.dataset.i,r=ROWS[i];const box=document.querySelector('.card').getBoundingClientRect();
   tt.style.display='block';tt.style.left=(e.clientX-box.left)+'px';tt.style.top=(e.clientY-box.top)+'px';
   tt.innerHTML=`<b>${M[i]}</b> · ${v.pct?fmt(vals[i],true):fmt(vals[i],false)}<br>signups ${fmt(r.signups)} · leads ${fmt(r.leads)} · booked ${fmt(r.booked)} · closes ${fmt(r.closes)}`;
   xh.style.display='block';xh.setAttribute('x1',xs(i));xh.setAttribute('x2',xs(i))};rc.onmouseleave=()=>{tt.style.display='none';xh.style.display='none'}});
 document.getElementById('tbl').innerHTML='<table><tr><th>Month</th><th>Signups</th><th>Leads</th><th>Signup→lead</th><th>Booked</th><th>Lead→booked</th><th>HT closes</th><th>Booked→close</th><th>Elite cash</th></tr>'+ROWS.map((r,i)=>`<tr><td>${M[i]}</td><td>${fmt(r.signups)}</td><td>${fmt(r.leads)}</td><td>${fmt(r.s2l,true)}</td><td>${fmt(r.booked)}</td><td>${fmt(r.l2b,true)}</td><td>${fmt(r.closes)}</td><td>${fmt(r.b2c,true)}</td><td>${r.cash==null?'—':'$'+r.cash.toLocaleString()}</td></tr>`).join('')+'</table>';
}
function renderLQ(){
 const o=(LQ&&LQ.overall)||{total:0,green:0,yellow:0,red:0,green_rate:0,avg_score:0};
 document.getElementById('hv').textContent=o.green_rate+'%';
 document.getElementById('hs').textContent='green-rate · '+o.total+' lead'+(o.total===1?'':'s')+' scored';
 const t=(cls,lbl,n)=>`<div class="tile"><div class="n" style="color:var(--${cls})">${n}</div><div class="l">${lbl}</div><div class="p">${o.total?Math.round(100*n/o.total):0}% of leads</div></div>`;
 let html=`<div class="tiles">${t('green','🟢 Green (ready)',o.green)}${t('yellow','🟡 Yellow (maybe)',o.yellow)}${t('red','🔴 Red (nurture)',o.red)}</div>`;
 html+=`<div class="tiles"><div class="tile"><div class="n">${o.avg_score}</div><div class="l">Avg score / 100</div></div><div class="tile"><div class="n">${o.total}</div><div class="l">Total scored</div></div></div>`;
 const mo=(LQ&&LQ.monthly)||[];
 if(mo.length>=2){
   const W=900,H=220,L=40,R=20,T=16,B=34,xs=i=>L+i*(W-L-R)/(mo.length-1),ys=y=>T+(H-T-B)*(1-y/100);
   let g='';for(let k=0;k<=5;k++){const yv=k*20,y=ys(yv);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${yv}%</text>`}
   let p='',pts='',xl='';mo.forEach((m,i)=>{const X=xs(i),Y=ys(m.green_rate);p+=(i?' L':' M')+X+' '+Y;pts+=`<circle cx="${X}" cy="${Y}" r="4.5" fill="var(--green)" stroke="var(--card)" stroke-width="2"/><text x="${X}" y="${Y-11}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--text)">${m.green_rate}%</text>`;xl+=`<text x="${X}" y="${H-B+22}" text-anchor="middle" font-size="12" fill="var(--text2)">${m.mo.slice(5)}</text>`});
   html+=`<p class="foot" style="margin:14px 0 2px">Green-rate by month</p><svg viewBox="0 0 ${W} ${H}">${g}<path d="${p}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>${pts}${xl}</svg>`;
 }
 document.getElementById('chart').innerHTML=html;
 document.getElementById('tbl').innerHTML='<table><tr><th>Month</th><th>Scored</th><th>🟢</th><th>🟡</th><th>🔴</th><th>Green-rate</th><th>Avg</th></tr>'+(mo.length?mo.map(m=>`<tr><td>${m.mo}</td><td>${m.total}</td><td>${m.green}</td><td>${m.yellow}</td><td>${m.red}</td><td>${m.green_rate}%</td><td>${m.avg_score}</td></tr>`).join(''):'<tr><td colspan="7" style="text-align:center;color:var(--muted)">No leads scored yet — waiting on bookings.</td></tr>')+'</table>';
}
async function loadLQ(btn){
 if(btn){btn.disabled=true;btn.textContent='⏳ …';}
 try{const r=await fetch(SUPA+'/rest/v1/rpc/lead_score_summary',{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+ANON,'Content-Type':'application/json'},body:'{}'});LQ=await r.json();}
 catch(e){if(!LQ)LQ={overall:{total:0,green:0,yellow:0,red:0,green_rate:0,avg_score:0},monthly:[]};}
 if(btn){btn.disabled=false;btn.textContent='🔄 Refresh';}
 if(VIEWS[cur].type==='lq')render();
}
document.getElementById('tb').onclick=function(){const t=document.getElementById('tbl');const on=t.style.display==='none';t.style.display=on?'block':'none';this.textContent=on?'Hide table':'Show table'};
document.getElementById('refresh').onclick=function(){loadLQ(this);};
render();loadLQ();
</script></body></html>
