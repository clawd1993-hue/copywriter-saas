<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Faceless Creators Hub — Silo Checklists</title>
<style>
  :root{--bg:#0b0f1a;--card2:#0e1424;--line:#1e2740;--txt:#e7ecf6;
    --muted:#8a93a9;--accent:#6d5efc;--accent2:#22d3ee;--ok:#22c55e}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:0 0 50px}
  .wrap{max-width:620px;margin:0 auto;padding:20px 16px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
  .brand .dot{width:12px;height:12px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 14px var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin:4px 0 14px}
  .bar-row{display:flex;gap:10px;align-items:center;margin:6px 0 16px}
  .picker{flex:1;position:relative}
  .picker select{width:100%;appearance:none;background:var(--card2);color:var(--txt);
    border:1px solid var(--line);border-radius:10px;padding:11px 36px 11px 13px;font-size:15px;font-weight:600;cursor:pointer}
  .picker::after{content:"▾";position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  .newbtn{flex:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;
    border-radius:10px;padding:11px 15px;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
  .progress{height:9px;background:var(--line);border-radius:999px;overflow:hidden}
  .progress>i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
  .pct{font-size:13px;color:var(--muted);text-align:right;margin:5px 0 16px}
  .item{display:flex;gap:14px;align-items:center;padding:16px 6px;border-bottom:1px solid var(--card2);cursor:pointer}
  .item:active{background:var(--card2)}
  .num{flex:none;width:22px;color:var(--muted);font-size:13px;text-align:right}
  .box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid #3a4566;
    display:grid;place-items:center;transition:.15s;font-size:17px;color:#fff;font-weight:700}
  .item.done .box{background:linear-gradient(135deg,var(--ok),#16a34a);border-color:transparent}
  .item.done .box::after{content:"✓"}
  .lbl{flex:1;font-size:16px}
  .lbl .note{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;text-decoration:none}
  .lbl .warn{color:#f59e0b;font-weight:700}
  .item.done .lbl{color:var(--muted);text-decoration:line-through;text-decoration-color:#3a4566}
  .item.done .lbl .note{text-decoration:line-through;text-decoration-color:#3a4566}
  .footer{display:flex;gap:10px;margin-top:24px}
  .resetbtn{flex:1;background:var(--card2);border:1px solid #3a2030;color:#ff9d9d;
    border-radius:10px;padding:12px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .delbtn{flex:none;background:var(--card2);border:1px solid #3a2030;color:#ff9d9d;
    border-radius:10px;padding:12px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .banner{background:linear-gradient(135deg,#0d2a1a,#0e2420);border:1px solid #1d5c3c;color:#8ff0bd;
    border-radius:12px;padding:13px;text-align:center;font-weight:700;margin-bottom:14px;display:none}
  .notes-wrap{margin-top:22px}
  .notes-wrap label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px;font-weight:600}
  .notes{width:100%;min-height:100px;resize:vertical;background:var(--card2);color:var(--txt);
    border:1px solid var(--line);border-radius:10px;padding:12px 13px;font:15px/1.5 inherit}
  .notes:focus{outline:none;border-color:var(--accent)}
  .synced{font-size:11px;color:var(--muted);text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span>Faceless Creators Hub</div>
  <div class="sub">🏭 Silo Setup Checklists — one per profile</div>

  <div class="bar-row">
    <div class="picker"><select id="picker"></select></div>
    <button class="newbtn" id="link" title="Copy link to this checklist">🔗</button>
    <button class="newbtn" id="new">＋ New</button>
  </div>

  <div class="progress"><i id="bar"></i></div>
  <div class="pct" id="pct">0 / 13</div>

  <div class="banner" id="banner">✅ Silo setup complete.</div>
  <div id="list"></div>

  <div class="notes-wrap">
    <label>📝 Notes</label>
    <textarea class="notes" id="notes" placeholder="Drop random thoughts for this silo…"></textarea>
  </div>

  <div class="footer">
    <button class="resetbtn" id="reset">↺ Reset boxes</button>
    <button class="delbtn" id="del">🗑 Delete</button>
  </div>
  <div class="synced" id="synced">☁️ Saved to cloud — syncs across every browser &amp; profile</div>
</div>

<script>
const ITEMS=[
  ["New profile"],
  ["Profile warmed up/Password changed"],
  ["New BM"],
  ["New page"],
  ["New pixel"],
  ["Add pixel to funnel"],
  ["Publish funnel on new domain"],
  ["Fix downsell flow"],
  ["New Hyros domain connect"],
  ["Hyros tracking code on funnel"],
  ["Set Hyros to forward Leads + Purchase to new pixel"],
  ["ProveSource code added and setup"],
  ["Warm up ad launched"],
  ["Sales ad launched"],
];
const API="https://copywriter-saas.onrender.com/api";
const STATE_API=id=>`${API}/checklist/${id}`;
const NOTES_API=id=>`${API}/kv/notes-${id}`;
const INDEX_API=`${API}/kv/fch-index`;
const LS_IDX="fch_index_v1";
const stateKey=id=>"fch_state_"+id;
const notesKey=id=>"fch_notes_"+id;

// Fetch JSON, retrying through backend cold starts. Rejects only after all retries fail.
// Resolves ONLY on a real 200 — a 5xx/offline is retried, never mistaken for "empty data".
function getJSON(url,tries){
  tries=(tries==null?5:tries);
  return new Promise((resolve,reject)=>{
    (function go(n){
      fetch(url,{cache:"no-store"}).then(r=>{
        if(r.status>=500) throw new Error("upstream "+r.status);
        return r.json();
      }).then(resolve).catch(err=>{ if(n>0) setTimeout(()=>go(n-1),2000); else reject(err); });
    })(tries);
  });
}
let ready=false,loadSeq=0;
function setBusy(b,msg){
  list.style.opacity=b?"0.45":"1";
  list.style.pointerEvents=b?"none":"auto";
  const s=$("synced");
  if(s) s.textContent=msg||(b?"⏳ Loading your saved progress…":"☁️ Saved to cloud — syncs across every browser & profile");
}

// index = { checklists:[{id,name,created}], current:id }
let index=JSON.parse(localStorage.getItem(LS_IDX)||"null");
if(!index||!Array.isArray(index.checklists)) index={checklists:[],current:null};
let done={};

const $=id=>document.getElementById(id);
const list=$("list"),picker=$("picker"),notes=$("notes");

function slug(s){return (s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)||"silo";}
function curId(){return index.current;}
function curName(){const c=index.checklists.find(c=>c.id===index.current);return c?c.name:"";}

function renderPicker(){
  picker.innerHTML=index.checklists.map(c=>`<option value="${c.id}" ${c.id===index.current?"selected":""}>${c.name.replace(/</g,"&lt;")}</option>`).join("");
}
function renderList(){
  list.innerHTML=ITEMS.map((it,i)=>{
    const note=it[1]?`<span class="note">${it[1]}</span>`:"";
    return `<div class="item ${done[i]?'done':''}" data-i="${i}"><div class="num">${i+1}</div><div class="box"></div><div class="lbl">${it[0]}${note}</div></div>`;
  }).join("");
}
function bar(){
  const d=ITEMS.filter((_,i)=>done[i]).length,p=Math.round(d/ITEMS.length*100);
  $("bar").style.width=p+"%";
  $("pct").textContent=d+" / "+ITEMS.length;
  $("banner").style.display=(d===ITEMS.length&&d>0)?"block":"none";
}

let idxTimer=null;
function saveIndex(){
  localStorage.setItem(LS_IDX,JSON.stringify(index));
  clearTimeout(idxTimer);
  idxTimer=setTimeout(()=>{fetch(INDEX_API,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({value:index})}).catch(()=>{});},400);
}
let stTimer=null;
function saveState(){
  if(!ready)return;                        // never write before the real state has loaded (prevents clobbering with an empty view)
  const id=curId();if(!id)return;
  localStorage.setItem(stateKey(id),JSON.stringify(done));
  clearTimeout(stTimer);
  stTimer=setTimeout(()=>{fetch(STATE_API(id),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({state:done})}).catch(()=>{});},400);
}

function loadState(id){
  const seq=++loadSeq;ready=false;setBusy(true);
  done=JSON.parse(localStorage.getItem(stateKey(id))||"{}");   // optimistic paint from cache
  renderList();bar();loadNotes(id);
  getJSON(STATE_API(id),6).then(d=>{
    if(seq!==loadSeq)return;                                   // a newer load started — ignore this one
    const remote=d&&d.state&&typeof d.state==="object"?d.state:{};
    done=remote;localStorage.setItem(stateKey(id),JSON.stringify(done));  // server is source of truth
    renderList();bar();ready=true;setBusy(false);
  }).catch(()=>{
    if(seq!==loadSeq)return;
    ready=true;setBusy(false,"⚠️ Offline — showing last saved copy, will sync when reconnected");
  });
}
let noteTimer=null;
function saveNotes(){
  const id=curId();if(!id)return;
  const val=notes.value;                 // capture id + value NOW, not when the timer fires
  localStorage.setItem(notesKey(id),val);
  clearTimeout(noteTimer);
  noteTimer=setTimeout(()=>{noteTimer=null;fetch(NOTES_API(id),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({value:val})}).catch(()=>{});},500);
}
function flushNotes(){                    // push any pending note for the CURRENT checklist before we switch away
  if(noteTimer){clearTimeout(noteTimer);noteTimer=null;}
  const id=curId();if(!id)return;
  const val=notes.value;
  localStorage.setItem(notesKey(id),val);
  fetch(NOTES_API(id),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({value:val})}).catch(()=>{});
}
function loadNotes(id){
  notes.value=localStorage.getItem(notesKey(id))||"";        // optimistic from cache
  getJSON(NOTES_API(id),4).then(d=>{
    if(curId()!==id)return;                                   // switched away — ignore
    const remote=typeof (d&&d.value)==="string"?d.value:"";
    notes.value=remote;localStorage.setItem(notesKey(id),remote);  // server wins
  }).catch(()=>{});
}

function setHash(id){try{history.replaceState(null,"",location.pathname+location.search+"#"+encodeURIComponent(id));}catch(e){location.hash=id;}}
function hashId(){try{return decodeURIComponent((location.hash||"").replace(/^#/,""))||null;}catch(e){return null;}}
function applyHash(){const h=hashId();if(h&&index.checklists.find(c=>c.id===h)){index.current=h;return true;}return false;}
function switchTo(id){if(id===index.current)return;flushNotes();index.current=id;renderPicker();saveIndex();setHash(id);loadState(id);}

function newChecklist(){
  const name=(prompt("Name this checklist (profile / domain):")||"").trim();
  if(!name)return;
  flushNotes();
  const id=slug(name)+"-"+Date.now().toString(36);
  index.checklists.push({id,name,created:new Date().toISOString()});
  index.current=id;done={};notes.value="";
  ready=true;setBusy(false);                 // fresh empty checklist — safe to edit/save immediately
  renderPicker();renderList();bar();saveIndex();setHash(id);saveState();
}

picker.addEventListener("change",e=>switchTo(e.target.value));
notes.addEventListener("input",saveNotes);
$("new").onclick=newChecklist;
$("link").onclick=()=>{
  const url=location.href;
  const done=()=>{const b=$("link");b.textContent="✓";setTimeout(()=>b.textContent="🔗",1200);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(done).catch(()=>prompt("Copy link to this checklist:",url));}
  else prompt("Copy link to this checklist:",url);
};
list.addEventListener("click",e=>{
  if(!ready)return;
  const it=e.target.closest("[data-i]");if(!it)return;
  const i=it.dataset.i;done[i]=!done[i];
  it.classList.toggle("done",done[i]);saveState();bar();
});
$("reset").onclick=()=>{if(!ready)return;if(confirm('Reset all boxes on "'+curName()+'"?')){done={};saveState();renderList();bar();}};
$("del").onclick=()=>{
  if(index.checklists.length<=1){alert("Can't delete your last checklist — reset it instead.");return;}
  if(!confirm('Delete checklist "'+curName()+'"? This can\'t be undone.'))return;
  index.checklists=index.checklists.filter(c=>c.id!==index.current);
  index.current=index.checklists[0].id;
  renderPicker();saveIndex();loadState(index.current);
};

// ---- boot: pull index from server (server wins), seed a default if none ----
function ensureSeed(){
  if(index.checklists.length===0){
    index.checklists=[{id:"facelesscreatorshub",name:"Faceless Creators Hub",created:new Date().toISOString()}];
    index.current="facelesscreatorshub";
  }
  if(!index.current||!index.checklists.find(c=>c.id===index.current)) index.current=index.checklists[0].id;
}
ensureSeed();applyHash();renderPicker();setHash(index.current);loadState(index.current);
getJSON(INDEX_API,6).then(d=>{
  const v=d&&d.value;
  if(v&&Array.isArray(v.checklists)&&v.checklists.length){
    index=v;localStorage.setItem(LS_IDX,JSON.stringify(index));
    ensureSeed();applyHash();renderPicker();setHash(index.current);loadState(index.current);
  }else{saveIndex();}            // server confirmed empty (200) — seed it; NOT reached on a transient error (those retry/reject)
}).catch(()=>{/* offline after retries — keep local index, never overwrite server */});
// react to back/forward or pasted #hash while open
window.addEventListener("hashchange",()=>{const h=hashId();if(h&&h!==index.current&&index.checklists.find(c=>c.id===h)){flushNotes();index.current=h;renderPicker();loadState(h);}});
window.addEventListener("beforeunload",flushNotes);
</script>
</body>
</html>
