<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Faceless Creators Hub — Silo Checklist</title>
<style>
  :root{--bg:#0b0f1a;--card2:#0e1424;--line:#1e2740;--txt:#e7ecf6;
    --muted:#8a93a9;--accent:#6d5efc;--accent2:#22d3ee;--ok:#22c55e}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:0 0 50px}
  .wrap{max-width:620px;margin:0 auto;padding:20px 16px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
  .brand .dot{width:12px;height:12px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 14px var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin:4px 0 14px}
  .progress{height:9px;background:var(--line);border-radius:999px;overflow:hidden}
  .progress>i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
  .pct{font-size:13px;color:var(--muted);text-align:right;margin:5px 0 16px}
  .item{display:flex;gap:14px;align-items:center;padding:16px 6px;border-bottom:1px solid var(--card2);cursor:pointer}
  .item:active{background:var(--card2)}
  .num{flex:none;width:22px;color:var(--muted);font-size:13px;text-align:right}
  .box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid #3a4566;
    display:grid;place-items:center;transition:.15s;font-size:17px;color:#fff;font-weight:700}
  .item.done .box{background:linear-gradient(135deg,var(--ok),#16a34a);border-color:transparent}
  .item.done .box::after{content:"✓"}
  .lbl{flex:1;font-size:16px}
  .lbl .note{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;text-decoration:none}
  .lbl .warn{color:#f59e0b;font-weight:700}
  .item.done .lbl{color:var(--muted);text-decoration:line-through;text-decoration-color:#3a4566}
  .item.done .lbl .note{text-decoration:line-through;text-decoration-color:#3a4566}
  .resetbtn{margin-top:24px;background:var(--card2);border:1px solid #3a2030;color:#ff9d9d;
    border-radius:10px;padding:12px 14px;font-size:14px;font-weight:600;cursor:pointer;width:100%}
  .banner{background:linear-gradient(135deg,#0d2a1a,#0e2420);border:1px solid #1d5c3c;color:#8ff0bd;
    border-radius:12px;padding:13px;text-align:center;font-weight:700;margin-bottom:14px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span>Faceless Creators Hub</div>
  <div class="sub">🏭 Silo Setup Checklist</div>
  <div class="progress"><i id="bar"></i></div>
  <div class="pct" id="pct">0 / 11</div>

  <div class="banner" id="banner">✅ Silo setup complete.</div>
  <div id="list"></div>

  <button class="resetbtn" id="reset">↺ Reset (new silo)</button>
</div>

<script>
const ITEMS=[
  ["New profile"],
  ["New BM"],
  ["New page"],
  ["New pixel"],
  ["Add pixel to funnel"],
  ["Publish funnel on new domain"],
  ["Fix downsell flow"],
  ["New Hyros domain connect"],
  ["Hyros tracking code on funnel"],
  ['<span class="warn">⚠️</span> Set Hyros to forward LEADS + PURCHASE to THIS pixel',"Off by default — burned us before"],
  ["ProveSource code added and setup"],
];
const LS="fch_v5";
let done=JSON.parse(localStorage.getItem(LS)||"{}");
const list=document.getElementById("list");
list.innerHTML=ITEMS.map((it,i)=>{
  const note=it[1]?`<span class="note">${it[1]}</span>`:"";
  return `<div class="item ${done[i]?'done':''}" data-i="${i}"><div class="num">${i+1}</div><div class="box"></div><div class="lbl">${it[0]}${note}</div></div>`;
}).join("");
function bar(){
  const d=ITEMS.filter((_,i)=>done[i]).length,p=Math.round(d/ITEMS.length*100);
  document.getElementById("bar").style.width=p+"%";
  document.getElementById("pct").textContent=d+" / "+ITEMS.length;
  document.getElementById("banner").style.display=(d===ITEMS.length)?"block":"none";
}
list.addEventListener("click",e=>{
  const it=e.target.closest("[data-i]");if(!it)return;
  const i=it.dataset.i;done[i]=!done[i];
  it.classList.toggle("done",done[i]);
  localStorage.setItem(LS,JSON.stringify(done));bar();
});
document.getElementById("reset").onclick=()=>{
  if(confirm("Reset all boxes?")){done={};localStorage.setItem(LS,"{}");
    document.querySelectorAll(".item").forEach(x=>x.classList.remove("done"));bar();}
};
bar();
</script>
</body>
</html>
